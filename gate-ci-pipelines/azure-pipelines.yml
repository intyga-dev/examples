# Gate a production deploy on a signed human approval — Azure Pipelines.
#
# Two stages, because the deploy stage carries an `environment:` and the credentials. Azure's own
# environment approvals answer "did someone with access click approve"; this answers "did a named
# person sign these exact parameters". They compose — keep both.

trigger: none

variables:
  intygaTarget: prod-eu-1
  intygaActionType: deploy_production

stages:
  - stage: Approve
    jobs:
      - job: request
        displayName: Request human approval
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '24.x'

          - bash: |
              set -euo pipefail
              PARAMS=$(jq -cn --arg sha "$(Build.SourceVersion)" '{sha:$sha,environment:"production"}')

              # The last line of stdout is the machine-readable JSON — a human-readable banner comes
              # first. `$GITHUB_OUTPUT` is GitHub-only and is a no-op here, and the key in this JSON
              # is `approvalUrl`, not `approval_url`.
              OUT=$(npx --yes @intyga/sdk authorize "Deploy $(Build.SourceVersion) to production" \
                --gateway "$INTYGA_GATEWAY_URL" \
                --web "$INTYGA_WEB_URL" \
                --target "$(intygaTarget)" \
                --type "$(intygaActionType)" \
                --params "$PARAMS" \
                --no-wait --no-open | tail -n1)

              NONCE=$(printf '%s' "$OUT" | jq -r .nonce)
              URL=$(printf '%s' "$OUT" | jq -r .approvalUrl)

              # isOutput=true is what makes these readable from the next stage.
              echo "##vso[task.setvariable variable=nonce;isOutput=true]$NONCE"
              echo "##vso[task.setvariable variable=params;isOutput=true]$PARAMS"
              echo "Approve at: $URL"

              if [ -n "${INTYGA_SLACK_WEBHOOK:-}" ]; then
                npx --yes @intyga/sdk notify \
                  --url "$URL" \
                  --context "Deploy $(Build.SourceVersion) to production" \
                  --slack "$INTYGA_SLACK_WEBHOOK"
              fi
            name: approval
            displayName: intyga authorize
            env:
              INTYGA_GATEWAY_URL: $(INTYGA_GATEWAY_URL)
              INTYGA_WEB_URL: $(INTYGA_WEB_URL)
              INTYGA_CLIENT_ID: $(INTYGA_CLIENT_ID)
              INTYGA_CLIENT_SECRET: $(INTYGA_CLIENT_SECRET)
              INTYGA_SLACK_WEBHOOK: $(INTYGA_SLACK_WEBHOOK)

  - stage: Deploy
    dependsOn: Approve
    variables:
      nonce: $[ stageDependencies.Approve.request.outputs['approval.nonce'] ]
      params: $[ stageDependencies.Approve.request.outputs['approval.params'] ]
    jobs:
      - deployment: deploy
        displayName: Await signature and deploy
        pool:
          vmImage: ubuntu-latest
        # Deploy credentials are scoped to this environment and unreachable from the Approve stage.
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: NodeTool@0
                  inputs:
                    versionSpec: '24.x'

                # Blocks until signed, verifies the receipt against approver keys this job trusts,
                # and redeems it single-use. Non-zero exit fails the deployment before ./deploy.sh.
                - bash: |
                    set -euo pipefail
                    npx --yes @intyga/sdk await "$(nonce)" \
                      --gateway "$INTYGA_GATEWAY_URL" \
                      --target "$(intygaTarget)" \
                      --type "$(intygaActionType)" \
                      --params '$(params)' \
                      --timeout 1800 --consume
                  displayName: intyga await --consume
                  env:
                    INTYGA_GATEWAY_URL: $(INTYGA_GATEWAY_URL)
                    INTYGA_CLIENT_ID: $(INTYGA_CLIENT_ID)
                    INTYGA_CLIENT_SECRET: $(INTYGA_CLIENT_SECRET)
                    INTYGA_APPROVER_KEYS: $(INTYGA_APPROVER_KEYS)
                    # REQUIRED for passkey receipts — the approval console's origin and RP ID.
                    INTYGA_WEBAUTHN_ORIGIN: $(INTYGA_WEBAUTHN_ORIGIN)
                    INTYGA_WEBAUTHN_RP_ID: $(INTYGA_WEBAUTHN_RP_ID)

                - bash: ./deploy.sh
                  displayName: Deploy
